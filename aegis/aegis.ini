; Aegis DNS filter settings.
; Changes apply within a few seconds, except listen/port (restart the PC for those).

[dns]
; Addresses Aegis answers on. install.ps1 points Windows at these.
listen = 127.0.0.1, ::1
port = 53
; Where allowed lookups go. Quad9 also refuses known malware domains.
upstreams = 9.9.9.9, 149.112.112.112, 2620:fe::fe
; Local names (local_domains, single-label names, private reverse lookups) go to
; your router instead. auto = the DNS server you had before installing; none = off.
router = auto
local_domains = mynetworksettings.com, lan, home, home.arpa, local, localdomain, internal
; If Quad9 can't be reached at all, ask the router instead (still filtered by the lists).
router_fallback = true
; Seconds Windows may remember a 'blocked' answer. Short, so allowing a site works fast.
block_ttl = 5
; Also block a name that is an alias (CNAME) of a blocked domain.
cname_inspection = true
cache_entries = 20000
max_cache_ttl = 3600
upstream_timeout_ms = 2500
; Longest time (seconds) Windows may keep an allowed answer, so a new block works within a minute.
max_client_ttl = 60

[lists]
; name = URL | mirror URL. A listed domain also blocks all of its subdomains.
update_hours = 24
hagezi-pro = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt | https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro-onlydomains.txt
hagezi-tif-full = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt | https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif-onlydomains.txt

[logs]
; true = log every lookup (logs\queries-DATE.log), not only blocked ones.
log_all_queries = false
keep_log_days = 7
