; Arachne's tripwire list: which files to watch, which programs own them, and the decoys.
; Read when the tripwire is set up (install.cmd) and by the engine; edit it to add apps, then run
; install.cmd again.
;
; Paths may use {local} {roaming} {documents} {profile} {pf} (Program Files) {pf86} {programdata}.
; A "*" matches within one folder name; {profiles} means each browser profile folder ("Default",
; "Profile 1", ...), and {name} in a label is replaced by that folder's name.
;   file   = path | what it is          one file
;   folder = path | what it is          every file inside a folder
;   owner  = program path               programs allowed to read this kind of file

[kind:chrome]
owner = {pf}\Google\Chrome\Application\chrome.exe
owner = {pf86}\Google\Chrome\Application\chrome.exe
owner = C:\Users\*\AppData\Local\Google\Chrome\Application\chrome.exe
owner = {pf}\Google\Chrome\Application\*\elevation_service.exe
owner = {pf}\Google\Chrome\Application\*\notification_helper.exe
file = {local}\Google\Chrome\User Data\Local State | Chrome's key to your saved passwords
file = {local}\Google\Chrome\User Data\{profiles}\Login Data | Chrome saved passwords ({name})
file = {local}\Google\Chrome\User Data\{profiles}\Network\Cookies | Chrome cookies and sign-ins ({name})
file = {local}\Google\Chrome\User Data\{profiles}\Web Data | Chrome saved cards and autofill ({name})

[kind:edge]
owner = {pf86}\Microsoft\Edge\Application\msedge.exe
owner = {pf}\Microsoft\Edge\Application\msedge.exe
owner = {pf86}\Microsoft\Edge\Application\*\elevation_service.exe
owner = {pf86}\Microsoft\Edge\Application\*\identity_helper.exe
owner = {pf86}\Microsoft\Edge\Application\*\msedge_pwa_launcher.exe
file = {local}\Microsoft\Edge\User Data\Local State | Edge's key to your saved passwords
file = {local}\Microsoft\Edge\User Data\{profiles}\Login Data | Edge saved passwords ({name})
file = {local}\Microsoft\Edge\User Data\{profiles}\Network\Cookies | Edge cookies and sign-ins ({name})
file = {local}\Microsoft\Edge\User Data\{profiles}\Web Data | Edge saved cards and autofill ({name})

[kind:brave]
owner = {pf}\BraveSoftware\Brave-Browser\Application\brave.exe
owner = C:\Users\*\AppData\Local\BraveSoftware\Brave-Browser\Application\brave.exe
file = {local}\BraveSoftware\Brave-Browser\User Data\Local State | Brave's key to your saved passwords
file = {local}\BraveSoftware\Brave-Browser\User Data\{profiles}\Login Data | Brave saved passwords ({name})
file = {local}\BraveSoftware\Brave-Browser\User Data\{profiles}\Network\Cookies | Brave cookies and sign-ins ({name})

[kind:firefox]
owner = {pf}\Mozilla Firefox\firefox.exe
owner = {pf86}\Mozilla Firefox\firefox.exe
owner = {pf}\Mozilla Firefox\default-browser-agent.exe
file = {roaming}\Mozilla\Firefox\Profiles\*\logins.json | Firefox saved passwords
file = {roaming}\Mozilla\Firefox\Profiles\*\key4.db | Firefox's key to your saved passwords
file = {roaming}\Mozilla\Firefox\Profiles\*\cookies.sqlite | Firefox cookies and sign-ins

[kind:discord]
owner = C:\Users\*\AppData\Local\Discord\app-*\Discord.exe
owner = C:\Users\*\AppData\Local\Discord\Update.exe
folder = {roaming}\discord\Local Storage\leveldb | Discord login token

[kind:steam]
owner = {pf86}\Steam\steam.exe
owner = {pf86}\Steam\steamwebhelper.exe
owner = {pf86}\Steam\bin\cef\*\steamwebhelper.exe
owner = {pf86}\Common Files\Steam\steamservice.exe
owner = {pf86}\Steam\bin\steamservice.exe
file = {pf86}\Steam\config\loginusers.vdf | Steam accounts
file = {pf86}\Steam\config\config.vdf | Steam sign-in settings
file = {local}\Steam\local.vdf | Steam login token

[kind:telegram]
owner = C:\Users\*\AppData\Roaming\Telegram Desktop\Telegram.exe
owner = C:\Users\*\AppData\Roaming\Telegram Desktop\Updater.exe
folder = {roaming}\Telegram Desktop\tdata | Telegram session

; Programs that may read anything here: antivirus, Windows Search, Olympus's own backups.
[everyone]
owner = {programdata}\Microsoft\Windows Defender\Platform\*\MsMpEng.exe
owner = {programdata}\Microsoft\Windows Defender\Platform\*\MpDefenderCoreService.exe
owner = {pf}\Windows Defender\MsMpEng.exe
owner = C:\Windows\System32\SearchProtocolHost.exe
owner = C:\Windows\System32\SearchIndexer.exe
owner = C:\Windows\System32\SearchFilterHost.exe
owner = {pf}\Olympus\Ark.exe

; Decoys: files nothing legitimate ever opens. "unless" skips a decoy where a real app of that
; name is installed. They're hidden and kept out of Windows Search; uninstall.cmd removes them.
[decoy:bitcoin]
file = {roaming}\Bitcoin\wallet.dat | decoy Bitcoin wallet
unless = {roaming}\Bitcoin
content = {"wallet_type":"standard","seed_version":18,"keystore":{"type":"bip32","xprv":"xprv{random}"}}

[decoy:electrum]
file = {roaming}\Electrum\wallets\default_wallet | decoy Electrum wallet
unless = {roaming}\Electrum
content = {"wallet_type":"standard","seed_version":18,"keystore":{"type":"bip32","xprv":"xprv{random}"}}

[decoy:passwords]
file = {documents}\Passwords (old).txt | decoy passwords file
content = old logins - moved to the password manager\nemail: {random}@example.com  pw: {random}\nbank: {random}  pw: {random}
