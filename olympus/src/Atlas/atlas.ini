; Atlas's cleanup list: each [clean:ID] section is one row on the Clean up tab.
; Only places programs fill with throwaway data belong here.
;
;   name        what the row is called
;   about       one line on what it is and what cleaning it does
;   path        a folder (everything inside it), a file, or a pattern like folder\*.log;
;               %VARIABLES% and * in folder names work; repeat the line for more places
;   older_than  only files not changed for this long (2d, 12h, 1w)
;   how         delete (gone for good: temp files and caches) or recycle (to the Recycle Bin)
;   default     true ticks it for you
;   wait_for    programs that must be closed first (process names, comma-separated)
;   keep        file names to leave alone (wildcards)
;
; Windows' own folders (C:\Windows\Temp, crash dumps, Windows Update downloads) are built into
; Atlas: cleaning them needs admin rights, so that list can't come from a file your account can
; edit. Atlas also refuses whole drives, Windows, Program Files, your main folders and Ark's
; backups, whatever this file says.

[clean:temp]
name = Your temporary files
about = What programs leave in your Temp folder. Files from the last 2 days and anything in use stay.
path = %TEMP%
older_than = 2d
how = delete
default = true

[clean:error-reports]
name = Your error reports
about = Reports Windows saved about programs that crashed or hung.
path = %LOCALAPPDATA%\Microsoft\Windows\WER
how = delete
default = true

[clean:amd-installers]
name = AMD driver installer files
about = What AMD's installer unpacks to C:\AMD. Not needed once the driver is in; AMD's site has them if you reinstall.
path = C:\AMD
how = delete
default = true

[clean:steam-logs]
name = Steam's logs and crash dumps
about = Old log files and crash reports from Steam itself (a week old or more).
path = %ProgramFiles(x86)%\Steam\logs
path = %ProgramFiles(x86)%\Steam\dumps
older_than = 7d
how = delete
default = true

[clean:crash-dumps]
name = Program crash dumps
about = Memory dumps from programs and games that crashed. Keep them while you're chasing a crash.
path = %LOCALAPPDATA%\CrashDumps
how = delete
default = false

[clean:dx-shaders]
name = DirectX shader cache
about = Shaders Windows compiled for games. Games rebuild them, so the first minutes of play may stutter; worth it after a driver change.
path = %LOCALAPPDATA%\D3DSCache
how = delete
default = false

[clean:amd-shaders]
name = AMD shader caches
about = The AMD driver's compiled shaders (DirectX, Vulkan, OpenGL). Games rebuild them, so expect a little stutter at first.
path = %LOCALAPPDATA%\AMD\DxCache
path = %LOCALAPPDATA%\AMD\DxcCache
path = %LOCALAPPDATA%\AMD\VkCache
path = %LOCALAPPDATA%\AMD\GLCache
how = delete
default = false

[clean:browser-caches]
name = Browser caches
about = Pages and pictures browsers keep to open sites faster; they fill up again as you browse. Close the browser first.
path = %LOCALAPPDATA%\Google\Chrome\User Data\*\Cache
path = %LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache
path = %LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache
path = %LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache
path = %LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Cache
path = %LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2
how = delete
wait_for = chrome, msedge, brave, firefox
default = false

[clean:discord-cache]
name = Discord's cache
about = Pictures and videos Discord saved while you scrolled. Close Discord first.
path = %APPDATA%\discord\Cache
path = %APPDATA%\discord\Code Cache
path = %APPDATA%\discord\GPUCache
how = delete
wait_for = discord
default = false

[clean:dev-caches]
name = Developer download caches
about = Packages pip, npm and NuGet keep so they don't have to download them again.
path = %LOCALAPPDATA%\pip\cache
path = %LOCALAPPDATA%\npm-cache
path = %LOCALAPPDATA%\NuGet\v3-cache
how = delete
default = false
