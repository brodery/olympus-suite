name: Build Olympus for Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false

      - name: Build, test and package Olympus and Aegis
        shell: powershell
        run: .\build-release.ps1

      - name: Save installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Olympus-Windows-x64
          path: |
            dist/Olympus-Windows-x64.zip
            dist/Olympus-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Get the tested installer and checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Olympus-Windows-x64
          path: dist

      - name: Publish the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TESTED_COMMIT: ${{ needs.build.outputs.commit }}
        working-directory: dist
        run: |
          sha256sum --check Olympus-Windows-x64.zip.sha256
          tag_ref=$(jq -nr --arg ref "tags/$RELEASE_TAG" '$ref | @uri')
          verify_tag() {
            local current
            current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_ref" --jq '.sha')
            if [[ -z "$TESTED_COMMIT" || "$current" != "$TESTED_COMMIT" ]]; then
              echo 'The release tag no longer points to the tested commit.' >&2
              return 1
            fi
          }
          verify_tag
          assets=(Olympus-Windows-x64.zip Olympus-Windows-x64.zip.sha256)
          if release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets); then
            if ! jq -e '.isDraft' <<< "$release" > /dev/null; then
              jq -e '$ARGS.positional - [.assets[].name] == []' --args "${assets[@]}" <<< "$release"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft
          fi
          verify_tag
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
